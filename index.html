<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embr. Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter,sans-serif;
height:100vh;
overflow:hidden;
color:white;
}

/* BACKGROUND IMAGE */

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("background.jpg") center center;
background-size:cover;
transform:scale(1.08);
z-index:-3;
}

/* BLUR */

.bg::after{
content:"";
position:absolute;
inset:0;
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
background:rgba(0,0,0,0.15);
}

/* DARK OVERLAY */

.overlay{
position:fixed;
inset:0;
background:
linear-gradient(
180deg,
rgba(0,0,0,.55),
rgba(0,0,0,.45)
);
z-index:-2;
}

/* CONTENT */

.container{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
max-width:1100px;
margin:auto;
}

.logo{
width:220px;
margin-bottom:35px;
}

.coming{
letter-spacing:12px;
color:#ff8a00;
font-size:20px;
font-weight:500;
margin-bottom:30px;
}

h1{
font-size:88px;
line-height:1;
font-weight:800;
}

.orange{
color:#ff8a00;
}

.description{
max-width:700px;
margin-top:30px;
font-size:28px;
line-height:1.7;
color:rgba(255,255,255,.85);
}

/* TIMER */

.countdown{
display:flex;
gap:25px;
margin-top:60px;
flex-wrap:wrap;
justify-content:center;
}

.card{
width:190px;
height:190px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(20px);

border-radius:24px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.number{
font-size:72px;
font-weight:700;
}

.label{
margin-top:10px;
font-size:16px;
letter-spacing:4px;
color:#ff8a00;
}

.launch{
margin-top:50px;
font-size:24px;
letter-spacing:4px;
color:rgba(255,255,255,.9);
}

@media(max-width:900px){

h1{
font-size:58px;
}

.description{
font-size:20px;
}

.card{
width:140px;
height:140px;
}

.number{
font-size:48px;
}
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">

<img src="logo.png" class="logo">

<div class="coming">
COMING SOON
</div>

<h1>
Better connections.<br>
<span class="orange">Right in your area.</span>
</h1>

<div class="description">
Embr connects you with trusted local professionals across the Western Cape —
from plumbers and electricians to photographers and tutors.
</div>

<div class="countdown">

<div class="card">
<div class="number" id="days">00</div>
<div class="label">DAYS</div>
</div>

<div class="card">
<div class="number" id="hours">00</div>
<div class="label">HOURS</div>
</div>

<div class="card">
<div class="number" id="minutes">00</div>
<div class="label">MINUTES</div>
</div>

<div class="card">
<div class="number" id="seconds">00</div>
<div class="label">SECONDS</div>
</div>

</div>

<div class="launch">
LAUNCHING 18 JUNE 2026 • 00:00 SAST
</div>

</div>

<script>

const launchDate =
new Date("2026-06-18T00:00:00+02:00").getTime();

function updateCountdown(){

const now = new Date().getTime();

const distance = launchDate - now;

const days = Math.floor(distance/(1000*60*60*24));

const hours = Math.floor(
(distance%(1000*60*60*24))/
(1000*60*60)
);

const minutes = Math.floor(
(distance%(1000*60*60))/
(1000*60)
);

const seconds = Math.floor(
(distance%(1000*60))/
1000
);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
